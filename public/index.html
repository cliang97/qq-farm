<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>QQ 经典农场挂机面板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 960px; margin: 0 auto; }
    .card {
      background: rgba(30, 41, 59, 0.95);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #e2e8f0; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e5e7eb;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }
    .field { margin-bottom: 12px; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.07s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #22c55e); color: #fff; }
    .btn-secondary { background: #334155; color: #e2e8f0; border: 1px solid #475569; }
    .btn-ghost { background: transparent; color: #38bdf8; border: 1px solid #38bdf8; }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; min-width: 100px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      gap: 8px;
    }
    .status-on { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.5); }
    .status-off { background: rgba(51, 65, 85, 0.8); color: #94a3b8; border: 1px solid #475569; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .status-off .dot { background: #64748b; }
    .meta { font-size: 13px; color: #94a3b8; margin-top: 10px; }
    .meta span { margin-right: 16px; }
    .error { margin-top: 8px; font-size: 13px; color: #f87171; min-height: 20px; }
    .log-box {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      max-height: 200px;
      overflow: auto;
      white-space: pre-wrap;
      color: #94a3b8;
    }
    /* 二维码弹层 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal.hidden { display: none; }
    .modal-inner {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      border: 1px solid #475569;
      text-align: center;
    }
    .modal h3 { margin: 0 0 8px; font-size: 18px; }
    .modal p { margin: 0 0 16px; font-size: 14px; color: #94a3b8; }
    .qr-wrap {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .qr-wrap img { display: block; width: 240px; height: 240px; }
    .modal .status-msg { font-size: 13px; color: #94a3b8; margin-bottom: 12px; min-height: 20px; }
    .modal .status-msg.success { color: #86efac; }
    .modal .status-msg.err { color: #f87171; }
    .modal .btn-row { justify-content: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>QQ 经典农场挂机</h1>
      <div class="subtitle">支持手动填入 code 或 QQ 扫码登录（仅 QQ 平台）</div>

      <div class="field">
        <label for="code">登录 code</label>
        <div class="btn-row" style="margin-top: 6px;">
          <input id="code" type="text" placeholder="抓包获取的 code，或点击下方「二维码登录」获取" style="flex: 1; min-width: 0;" />
          <button type="button" id="qr-btn" class="btn btn-ghost">二维码登录（QQ）</button>
        </div>
      </div>

      <div class="field row">
        <div>
          <label for="platform">平台</label>
          <select id="platform">
            <option value="qq">QQ 小程序</option>
            <option value="wx">微信小程序</option>
          </select>
        </div>
        <div>
          <label>运行状态</label>
          <div id="status-pill" class="status-pill status-off">
            <span class="dot"></span>
            <span id="status-text">未运行</span>
          </div>
        </div>
      </div>

      <div class="field row">
        <div>
          <label for="farm-interval">农场巡查间隔（秒）</label>
          <input id="farm-interval" type="number" min="1" value="10" />
        </div>
        <div>
          <label for="friend-interval">好友巡查间隔（秒）</label>
          <input id="friend-interval" type="number" min="1" value="1" />
        </div>
      </div>

      <div class="btn-row">
        <button id="start-btn" class="btn btn-primary">启动挂机</button>
        <button id="stop-btn" class="btn btn-secondary">停止</button>
      </div>
      <div id="error" class="error"></div>
      <div class="meta" id="meta">平台：-- | 等级：-- | 金币：--</div>
    </div>

    <div class="card">
      <label>状态概要</label>
      <div class="meta" style="margin-bottom: 6px;">最后更新: <span id="last-update">--</span></div>
      <div id="log" class="log-box">加载中...</div>
    </div>
  </div>

  <!-- 二维码弹层 -->
  <div id="qr-modal" class="modal hidden">
    <div class="modal-inner">
      <h3>QQ 扫码登录</h3>
      <p>请使用 QQ 扫描下方二维码</p>
      <div class="qr-wrap" id="qr-wrap">
        <img id="qr-img" src="" alt="QR" />
      </div>
      <div id="qr-status" class="status-msg">等待扫码...</div>
      <div class="btn-row">
        <button id="qr-close" class="btn btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <script>
    const codeInput = document.getElementById('code');
    const platformSelect = document.getElementById('platform');
    const statusPill = document.getElementById('status-pill');
    const statusText = document.getElementById('status-text');
    const logEl = document.getElementById('log');
    const errorEl = document.getElementById('error');
    const metaEl = document.getElementById('meta');
    const lastUpdateEl = document.getElementById('last-update');
    const qrModal = document.getElementById('qr-modal');
    const qrImg = document.getElementById('qr-img');
    const qrStatus = document.getElementById('qr-status');
    const qrClose = document.getElementById('qr-close');
    const qrBtn = document.getElementById('qr-btn');

    function setRunning(running) {
      statusPill.classList.toggle('status-on', running);
      statusPill.classList.toggle('status-off', !running);
      statusText.textContent = running ? '运行中' : '未运行';
    }

    function formatTime() {
      const d = new Date();
      return d.getHours().toString().padStart(2, '0') + ':' +
        d.getMinutes().toString().padStart(2, '0') + ':' +
        d.getSeconds().toString().padStart(2, '0');
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status?t=' + Date.now());
        if (!res.ok) throw new Error('' + res.status);
        const data = await res.json();
        lastUpdateEl.textContent = formatTime();
        setRunning(data.running);
        const s = data.status || {};
        const platformLabel = data.platform === 'wx' ? '微信' : 'QQ';
        metaEl.textContent = '平台：' + platformLabel + ' | 等级：Lv' + (s.level || 0) + ' | 金币：' + (s.gold ?? '--');
        const lines = [
          '运行: ' + (data.running ? '是' : '否'),
          '平台: ' + platformLabel + ' | 昵称: ' + (s.name || '--'),
          '等级: Lv' + (s.level || 0) + ' | 经验: ' + (s.exp ?? '--') + ' | 金币: ' + (s.gold ?? '--'),
          '农场间隔: ' + (data.farmCheckInterval / 1000) + 's | 好友间隔: ' + (data.friendCheckInterval / 1000) + 's'
        ];
        logEl.textContent = lines.join('\n');
      } catch (e) {
        logEl.textContent = '获取状态失败: ' + e.message;
      }
    }

    async function startBot() {
      errorEl.textContent = '';
      const code = codeInput.value.trim();
      const platform = platformSelect.value;
      const farmIntervalSec = parseInt(document.getElementById('farm-interval').value, 10) || 10;
      const friendIntervalSec = parseInt(document.getElementById('friend-interval').value, 10) || 1;
      if (!code) {
        errorEl.textContent = '请先填写登录 code 或使用二维码登录获取';
        return;
      }
      try {
        const res = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, platform, farmIntervalSec, friendIntervalSec })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'HTTP ' + res.status);
        await fetchStatus();
      } catch (e) {
        errorEl.textContent = '启动失败: ' + e.message;
      }
    }

    async function stopBot() {
      errorEl.textContent = '';
      try {
        const res = await fetch('/api/stop', { method: 'POST' });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'HTTP ' + res.status);
        await fetchStatus();
      } catch (e) {
        errorEl.textContent = '停止失败: ' + e.message;
      }
    }

    // 二维码登录
    let qrPollTimer = null;
    async function openQrLogin() {
      qrStatus.textContent = '正在获取二维码...';
      qrStatus.classList.remove('success', 'err');
      qrModal.classList.remove('hidden');
      try {
        const res = await fetch('/api/qr/login');
        if (!res.ok) throw new Error('获取二维码失败');
        const { url, loginCode } = await res.json();
        qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(url);
        qrStatus.textContent = '请用 QQ 扫描二维码';
        if (qrPollTimer) clearInterval(qrPollTimer);
        qrPollTimer = setInterval(async () => {
          try {
            const r = await fetch('/api/qr/status?loginCode=' + encodeURIComponent(loginCode));
            const d = await r.json();
            if (d.status === 'OK' && d.code) {
              if (qrPollTimer) clearInterval(qrPollTimer);
              qrPollTimer = null;
              codeInput.value = d.code;
              qrStatus.textContent = '登录成功，code 已填入';
              qrStatus.classList.add('success');
              platformSelect.value = 'qq';
              setTimeout(() => { qrModal.classList.add('hidden'); }, 1500);
              fetchStatus();
              return;
            }
            if (d.status === 'Used') {
              if (qrPollTimer) clearInterval(qrPollTimer);
              qrPollTimer = null;
              qrStatus.textContent = '二维码已失效，请关闭后重试';
              qrStatus.classList.add('err');
            }
            if (d.status === 'Error') {
              qrStatus.textContent = '查询失败: ' + (d.error || '请重试');
              qrStatus.classList.add('err');
            }
          } catch (e) {
            qrStatus.textContent = '轮询失败: ' + e.message;
            qrStatus.classList.add('err');
          }
        }, 2000);
      } catch (e) {
        qrStatus.textContent = '获取二维码失败: ' + e.message;
        qrStatus.classList.add('err');
      }
    }

    function closeQrModal() {
      if (qrPollTimer) clearInterval(qrPollTimer);
      qrPollTimer = null;
      qrModal.classList.add('hidden');
    }

    qrBtn.addEventListener('click', openQrLogin);
    qrClose.addEventListener('click', closeQrModal);
    document.getElementById('start-btn').addEventListener('click', startBot);
    document.getElementById('stop-btn').addEventListener('click', stopBot);

    fetchStatus();
    // 每 2 秒轮询，页面可见时更及时；不可见时降频避免被浏览器节流
    const POLL_VISIBLE_MS = 2000;
    const POLL_HIDDEN_MS = 8000;
    let pollTimer = null;
    function schedulePoll() {
      if (pollTimer) clearTimeout(pollTimer);
      const ms = document.visibilityState === 'visible' ? POLL_VISIBLE_MS : POLL_HIDDEN_MS;
      pollTimer = setTimeout(() => {
        fetchStatus();
        schedulePoll();
      }, ms);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchStatus();
      schedulePoll();
    });
    schedulePoll();
  </script>
</body>
</html>
